name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # If the Lean cache already exists from a previous
            # successful CI run, restore it. Same as ArkLib.
            - name: Restore Lean cache
              uses: actions/cache/restore@v6
              id: lake-cache
              with:
                path: ./.lake
                key: ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}
                restore-keys: |
                  ${{ runner.os }}-lean-ci-

            # Set up Lean and expand individual
            # operations manually (build, cache, ...)
            - name: Set up Lean environment
              uses: leanprover/lean-action@v1.5.0
              with:
                auto-config: false
                build: false
                test: false
                lint: false
                use-github-cache: false
                use-mathlib-cache: false

            - name: Fetch dependency cache
              run: lake exe cache get

            # Build against the committed golden `SP1.lean`
            # generated from `leanemitter`.
            - name: Build with committed golden SP1.lean
              run: |
                  lake build
                  for f in $(find Soundcalc SoundcalcIO -name '*.lean'); do
                    [ -f ".lake/build/lib/lean/${f%.lean}.olean" ] || { echo "not built: $f"; fail=1; }
                  done
                  [ -z "$fail" ]

            # Regenerate `SP1.lean` (default exe param)
            - name: Regenerate SP1.lean
              run: |
                lake exe leanemitter

            # Reproduce soundcalc's`.md files (default exe param).
            # Current support: {sp1, airbender}.md.
            - name: Reproduce soundcalc's .md files
              run: |
                lake exe mdrenderer

            # Check whether the regenerated `SP1.lean` contains
            # mismatches with the committed golden `SP1.lean`
            # (exit code > 0 if any changes occur)
            - name: Check regenerated SP1.lean matches committed golden
              run: git diff --exit-code

            # Check whether the reproduced .md files match their
            # .md counterparts produced by the original `soundcalc`.
            # Current support: {sp1, airbender}.md.
            - name: Check reproduced .md files against soundcalc's golden .md files
              run: |
                files=("sp1.md" "airbender.md")
                failed=()

                for f in "${files[@]}"; do
                    if cmp -s "SoundcalcIO/ZkVM/$f" "SoundcalcIO/ZkVM/Ref/$f"; then
                        echo "$f regenerated correctly."
                    else
                        failed+=("$f")
                    fi
                done

                if [ ${#failed[@]} -eq 0 ]; then
                    echo "All reports were reproduced correctly!"
                else
                    echo "Mismatches: ${failed[*]}"
                    exit 1
                fi
            # Cache a successful build, unless a cache already exists.
            # Same pattern as ArkLib.
            - name: Save Lean cache
              if: success() && steps.lake-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                path: ./.lake
                key: ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}
